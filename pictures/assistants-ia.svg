<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <!-- Deux avatars, même modèle, rémunération différente -->
  <g fill="#42affa">
    <circle cx="150" cy="70" r="38"/>
    <path d="M80 175 Q80 118 150 118 Q220 118 220 175 Z"/>
  </g>
  <g fill="#e05a5a">
    <circle cx="450" cy="70" r="38"/>
    <path d="M380 175 Q380 118 450 118 Q520 118 520 175 Z"/>
  </g>
  <text x="150" y="208" text-anchor="middle" font-size="26" font-weight="bold" fill="#eeeeee">Johan</text>
  <text x="450" y="208" text-anchor="middle" font-size="26" font-weight="bold" fill="#eeeeee">Johanna</text>
  <rect x="185" y="225" width="230" height="34" rx="17" fill="none" stroke="#bbbbbb" stroke-width="2"/>
  <text x="300" y="248" text-anchor="middle" font-size="18" fill="#bbbbbb">même modèle : GPT-4</text>
  <!-- Rémunération : barres proportionnelles (100 et ~90) -->
  <rect x="60" y="290" width="180" height="40" rx="6" fill="#42affa"/>
  <rect x="360" y="290" width="162" height="40" rx="6" fill="#e05a5a"/>
  <rect x="522" y="290" width="18" height="40" rx="0" fill="none" stroke="#e05a5a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="150" y="365" text-anchor="middle" font-size="22" fill="#eeeeee">rémunération : 100</text>
  <text x="450" y="365" text-anchor="middle" font-size="22" fill="#eeeeee">≈ 90</text>
  <text x="300" y="405" text-anchor="middle" font-size="18" fill="#bbbbbb">sommes versées par les participants</text>
</svg>
