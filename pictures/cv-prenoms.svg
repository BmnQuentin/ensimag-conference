<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <!-- Deux CV identiques, seul le prénom change -->
  <g>
    <rect x="30" y="20" width="240" height="300" rx="10" fill="none" stroke="#bbbbbb" stroke-width="3"/>
    <rect x="55" y="45" width="190" height="34" rx="6" fill="#42affa"/>
    <text x="150" y="69" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Prénom A</text>
    <rect x="55" y="100" width="190" height="12" rx="6" fill="#777777"/>
    <rect x="55" y="128" width="150" height="12" rx="6" fill="#777777"/>
    <rect x="55" y="156" width="190" height="12" rx="6" fill="#777777"/>
    <rect x="55" y="184" width="120" height="12" rx="6" fill="#777777"/>
    <rect x="55" y="212" width="170" height="12" rx="6" fill="#777777"/>
    <rect x="55" y="240" width="140" height="12" rx="6" fill="#777777"/>
    <rect x="55" y="268" width="180" height="12" rx="6" fill="#777777"/>
  </g>
  <g>
    <rect x="330" y="20" width="240" height="300" rx="10" fill="none" stroke="#bbbbbb" stroke-width="3"/>
    <rect x="355" y="45" width="190" height="34" rx="6" fill="#e05a5a"/>
    <text x="450" y="69" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Prénom B</text>
    <rect x="355" y="100" width="190" height="12" rx="6" fill="#777777"/>
    <rect x="355" y="128" width="150" height="12" rx="6" fill="#777777"/>
    <rect x="355" y="156" width="190" height="12" rx="6" fill="#777777"/>
    <rect x="355" y="184" width="120" height="12" rx="6" fill="#777777"/>
    <rect x="355" y="212" width="170" height="12" rx="6" fill="#777777"/>
    <rect x="355" y="240" width="140" height="12" rx="6" fill="#777777"/>
    <rect x="355" y="268" width="180" height="12" rx="6" fill="#777777"/>
  </g>
  <text x="300" y="180" text-anchor="middle" font-size="40" fill="#eeeeee">=</text>
  <text x="150" y="375" text-anchor="middle" font-size="30" font-weight="bold" fill="#42affa">classé 1er</text>
  <text x="450" y="375" text-anchor="middle" font-size="30" font-weight="bold" fill="#e05a5a">classé 2e</text>
  <text x="300" y="410" text-anchor="middle" font-size="18" fill="#bbbbbb">même expérience, même diplôme, prénom différent</text>
</svg>
